<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Correo</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f7f7f7;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #e5e5e5;
    }

    h2 {
      color: #333;
    }

    .message-box {
      padding: 15px;
      background-color: #f1f1f1;
      border-radius: 8px;
      margin-top: 10px;
      white-space: pre-line;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>¡Nuevo Suscriptor a Noticias de ASOPORKMAG!</h2>

    <p><strong>Telefono:</strong> {{userPhone}}</p>
    <p><strong>Email:</strong> <a href="mailto:{{userEmail}}">{{userEmail}}</a></p>

    <p style="margin-top: 20px; color: #666;">
      <em>Para responder, utiliza el email del usuario que aparece arriba.</em>
    </p>

    <div class="footer">
      Este es un mensaje automático desde tu formulario de suscripciones a noticias.
    </div>
  </div>

</body>
</html>
