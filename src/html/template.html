<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Correo</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f7f7f7;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #e5e5e5;
    }

    h2 {
      color: #333;
    }

    .message-box {
      padding: 15px;
      background-color: #f1f1f1;
      border-radius: 8px;
      margin-top: 10px;
      white-space: pre-line;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Hola {{name}},</h2>

    <p>Recibiste un nuevo mensaje:</p>

    <div class="message-box">
      {{message}}
    </div>

    <p>Saludos,<br/>Tu sitio web</p>

    <div class="footer">
      Este es un mensaje automático, por favor no responder.
    </div>
  </div>

</body>
</html>
